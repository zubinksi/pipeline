    sources: [https://www.biospace.com/drug-development/silence-quiets-phase-iii-pace-for-lipoprotein-drug-seeks-partner]

  - id: solbinsiran
    name: Solbinsiran
    aliases: [LY3561774]
    company: Eli Lilly
    target: ANGPTL3
    lowers: triglycerides & LDL
    form: Shot, a few times a year
    often: "A few times a year"
    route: injection
    frequency: infrequent
    plain: "A shot that mainly lowers triglycerides (another blood fat), with a smaller drop in LDL."
    stage: phase2
    effect: "Triglycerides down about 50%, LDL about 17%"
    effect_short: "Triglycerides ↓ 50%; LDL ↓ 17%"
    effect_source: https://www.acc.org/latest-in-cardiology/clinical-trials/2025/03/28/03/10/prolong-ang3
    proven: untested
    proven_note: "Too early for a heart-attack trial."
    proven_source: https://www.acc.org/latest-in-cardiology/clinical-trials/2025/03/28/03/10/prolong-ang3
    note: "In mid-stage testing, mainly in people with very high triglycerides."
    sources: [https://clinicaltrials.gov/study/NCT07269210]
