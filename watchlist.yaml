# Watchlist for the weekly cholesterol-pipeline digest.
#
# Each drug's `stage` is a FLOOR: the digest takes the highest of this value,
# the highest phase seen on ClinicalTrials.gov, and an FDA approval found on
# openFDA. Use it for stages the APIs can't detect (e.g. "filed", or an
# approval outside the US). Stages: phase1, phase2, phase3, filed, approved.
#
# `aliases` are code names / brand names, used to search every source.
# `route` (pill, injection, infusion) and `frequency` (daily, monthly,
# infrequent, once) drive the filters on the site's pipeline.
# `badge` (optional) is a short tag shown next to the name in the pipeline strip.
# `plain` is a one-line plain-English description, used as context for the
# summary and as the "why it matters" fallback when the Claude API is off.
#
# Verified by web search on 2026-11-03 (sources listed per drug).
# Not tracked: daily-dosed drugs and drugs approved only outside the US
# (removed 2026-11-06: muvalaplin, enlicitide, laroprovstat, obicetrapib).
# Added 2026-11-07: approved non-daily options (evolocumab, alirocumab, inclisiran).
# clinicaltrials.gov itself was not reachable from the build sandbox, so the
# first real run on GitHub Actions is the first check against the registry.

settings:
  horizon_days: 60          # "On the horizon" window
  min_trial_phase: 2        # ignore new trials / status changes below this phase (halts are always reported)
  max_news_per_drug: 5
  discovery:                # flag NEW industry Phase 2/3 trials in these conditions that aren't on the watchlist
    enabled: true
    conditions: ["Hypercholesterolemia", "Lipoprotein(a)", "Hyperlipoproteinemia(a)", "Atherosclerotic Cardiovascular Disease"]
    max_items: 5

reader_context: >
  32 years old, not on cholesterol medication, with a family history of high
  cholesterol, so expects to need treatment eventually. Would prefer to avoid
  statins if possible. Most interested in non-statin options that don't need
  daily dosing (monthly or less often, or one-time), and anything targeting
  lipoprotein(a).

# Extra RSS feeds scanned for any watchlist drug name (in addition to a
# Google News search per drug, which picks up company press releases).
# (fda.gov's own RSS blocks GitHub's servers as bots, so it isn't listed;
# FDA approvals come from openFDA and FDA news shows up via Google News.)
feeds: []

# Dated events you know about (PDUFA dates, scheduled readouts). They appear
# under "On the horizon" when inside the window. Each needs a source URL.
events: []
#  - drug: obicetrapib
#    date: 2027-01-15
#    what: "FDA decision date (PDUFA)"
#    url: https://example.com/press-release

drugs:
  # Plain-language fields shown on the site and in the email:
  #   lowers  what it lowers (LDL, Lp(a), triglycerides)
  #   form    how you'd take it (often: the short version for the table)
  #   plain   one sentence
  #   effect  how much it lowers, from trials (with effect_source;
  #           effect_short for the table)
  #   proven  did it prevent heart attacks and strokes in a large trial?
  #           yes | testing (trial underway) | failed | untested (no trial yet)
  #           with proven_note and proven_source
  #   note    where it stands, in plain words
  #   badge   optional short flag

  # ---- approved ----
  - id: evolocumab
    name: Evolocumab
    aliases: [Repatha, AMG 145]
    company: Amgen
    target: PCSK9 (LDL)
    lowers: LDL
    form: Shot, every 2 weeks or monthly
    often: "Every 2–4 weeks"
    route: injection
    frequency: monthly
    plain: "A shot every 2 weeks or once a month that lowers LDL. Sold as Repatha; on the market since 2015."
    stage: approved
    effect: "LDL down about 60%"
    effect_short: "LDL ↓ 60%"
    effect_source: https://www.tctmd.com/news/fourier-evolocumab-reduces-risk-cvd-events-15-compared-placebo
    proven: "yes"
    proven_note: "15% fewer heart attacks, strokes and related events in a 27,000-person trial (FOURIER, 2017). A 2025 trial (VESALIUS-CV) also found a benefit in people who hadn't had a heart attack or stroke."
    proven_source: https://www.amgen.com/newsroom/press-releases/2025/10/landmark-phase-3-trial-vesaliuscv-meets-primary-endpoints-in-a-cardiovascular-primary-prevention-study-of-12000-patients
    note: "Approved and widely used, usually added to a statin or for people who can't take one."
    sources: [https://www.tctmd.com/news/fourier-evolocumab-reduces-risk-cvd-events-15-compared-placebo]

  - id: alirocumab
    name: Alirocumab
    aliases: [Praluent, SAR236553, REGN727]
    company: Sanofi / Regeneron
    target: PCSK9 (LDL)
    lowers: LDL
    form: Shot, every 2 weeks or monthly
    often: "Every 2–4 weeks"
    route: injection
    frequency: monthly
    plain: "A shot every 2 weeks or once a month that lowers LDL. Sold as Praluent."
    stage: approved
    effect: "LDL down about 50%"
    effect_short: "LDL ↓ 50%"
    effect_source: https://www.acc.org/Latest-in-Cardiology/Articles/2018/03/05/15/53/Sat-9am-ODYSSEY-Outcomes-CV-Outcomes-With-Alirocumab-After-ACS-acc-2018
    proven: "yes"
    proven_note: "About 15% fewer heart attacks, strokes and related events in a 19,000-person trial of people who'd recently had a heart attack (ODYSSEY OUTCOMES, 2018)."
    proven_source: https://www.acc.org/Latest-in-Cardiology/Articles/2018/03/05/15/53/Sat-9am-ODYSSEY-Outcomes-CV-Outcomes-With-Alirocumab-After-ACS-acc-2018
    note: "Approved and widely used. A once-a-month dose (300 mg) is on the US label."
    sources: [https://www.managedcaremag.com/news/fda-approves-once-monthly-dosing-option-praluent-injection/]

  - id: inclisiran
    name: Inclisiran
    aliases: [Leqvio, ALN-PCSsc, KJX839]
    company: Novartis
    target: PCSK9 (LDL)
    lowers: LDL
    form: Shot, twice a year (after two starter doses)
    often: "Twice a year"
    route: injection
    frequency: infrequent
    plain: "A shot twice a year that lowers LDL by switching off PCSK9 in the liver. Sold as Leqvio."
    stage: approved
    effect: "LDL down about 50%"
    effect_short: "LDL ↓ 50%"
    effect_source: https://www.pharmacytimes.com/view/inclisiran-shows-promise-treating-hyperlipidemia-in-phase-3-clinical-trials
    proven: testing
    proven_note: "Two large heart-attack prevention trials are running: ORION-4 (main data expected around Oct 2026) and VICTORION-2 PREVENT (around May 2027)."
    proven_source: https://clinicaltrials.gov/study/NCT03705234
    note: "Approved in the US and widely available. The least frequent cholesterol drug on the market today."
    sources: [https://www.pharmacytimes.com/view/inclisiran-shows-promise-treating-hyperlipidemia-in-phase-3-clinical-trials]

  - id: lerodalcibep
    name: Lerodalcibep
    aliases: [Lerochol, LIB003]
    company: LIB Therapeutics
    target: PCSK9 (LDL)
    lowers: LDL
    form: Shot, once a month
    often: "Monthly"
    route: injection
    frequency: monthly
    plain: "A once-a-month shot that lowers LDL. It can be kept at room temperature."
    stage: approved
    effect: "LDL down about 60%"
    effect_short: "LDL ↓ 60%"
    effect_source: https://www.hcplive.com/view/lerodalcibep-autoinjector-receives-fda-approval-for-hypercholesterolemia
    proven: untested
    proven_note: "No heart-attack trial of its own. Its 2026 label points to results from other drugs in the same class (Repatha, Praluent)."
    proven_source: https://www.pharmacytimes.com/view/fda-approves-autoinjector-device-for-lerodalcibep-liga-updates-indication-to-reflect-mace-risk-reduction
    note: "FDA-approved in Dec 2025 as Lerochol. An auto-injector pen was approved in Aug 2026."
    sources: [https://www.tctmd.com/news/fda-approves-lerodalcibep-adults-hypercholesterolemia]

  # ---- in development ----
  - id: lepodisiran
    name: Lepodisiran
    aliases: [LY3819469]
    company: Eli Lilly
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, possibly once or twice a year
    often: "1–2× a year"
    route: injection
    frequency: infrequent
    plain: "A shot that switches off the liver's production of Lp(a) for many months at a time."
    stage: phase3
    effect: "Lp(a) down about 94%"
    effect_short: "Lp(a) ↓ 94%"
    effect_source: https://www.acc.org/Latest-in-Cardiology/Journal-Scans/2025/03/24/16/30/sun-130pm-alpaca-acc-2025
    proven: testing
    proven_note: "A large final-stage trial (ACCLAIM-Lp(a)) is testing whether it prevents heart attacks and strokes. Results are expected around 2029."
    proven_source: https://www.clinicaltrialsarena.com/analyst-comment/jpm26-eli-lilly-lpa-drugs/
    note: "In final-stage trials. Results are expected around 2029."
    sources: [https://www.clinicaltrialsarena.com/analyst-comment/jpm26-eli-lilly-lpa-drugs/]

  - id: olpasiran
    name: Olpasiran
    aliases: [AMG 890, AMG890]
    company: Amgen
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, every 3 months or less often
    often: "Every 3+ months"
    route: injection
    frequency: infrequent
    plain: "A shot a few times a year that strongly lowers Lp(a)."
    stage: phase3
    effect: "Lp(a) down 95%+"
    effect_short: "Lp(a) ↓ 95%+"
    effect_source: https://www.amgen.com/newsroom/press-releases/2022/11/amgen-presents-new-phase-2-data-that-show-olpasiran-delivers-significant-reduction-in-lipoproteina-levels
    proven: testing
    proven_note: "Its large heart-attack prevention trial (OCEAN(a)-Outcomes) is fully enrolled. Amgen hasn't said when results will come; some sources point to 2028."
    proven_source: https://clinicaltrials.gov/study/NCT05581303
    note: "In final-stage trials, fully enrolled."
    sources: [https://clinicaltrials.gov/study/NCT05581303]

  - id: pelacarsen
    name: Pelacarsen
    aliases: [TQJ230, "IONIS-APO(a)-LRx", AKCEA-APO(a)-LRx]
    company: Novartis / Ionis
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, once a month
    often: "Monthly"
    route: injection
    frequency: monthly
    plain: "A monthly shot that lowers Lp(a). It was the first Lp(a) drug to finish a large final-stage trial."
    stage: phase3
    badge: setback
    effect: "Lp(a) down about 80%"
    effect_short: "Lp(a) ↓ 80%"
    effect_source: https://nutrition-evidence.com/article/377243/emerging-rna-therapeutics-to-lower-blood-levels-of-lpa-jacc-focus-seminar-24
    proven: failed
    proven_note: "Its large trial (Lp(a)HORIZON, Sep 2026) lowered Lp(a) but did not reduce heart attacks or strokes. Full results are still to be presented."
    proven_source: https://www.tctmd.com/news/lpahorizon-top-line-results-dash-hopes-pelacarsen
    note: "Future unclear after its final-stage trial missed its main goal."
    sources: [https://www.tctmd.com/news/lpahorizon-top-line-results-dash-hopes-pelacarsen]

  - id: verve102
    name: VERVE-102
    aliases: ["VERVE 102", LY4636581]
    company: Eli Lilly (Verve)
    target: PCSK9 (gene editing)
    lowers: LDL
    form: One-time infusion
    often: "Once"
    route: infusion
    frequency: once
    plain: "A one-time gene-editing treatment meant to lower LDL for life."
    stage: phase2
    effect: "LDL down up to 62%"
    effect_short: "LDL ↓ up to 62%"
    effect_source: https://www.hcplive.com/view/verve-102-lowers-pcsk9-ldl-c-interim-phase-1b-hypercholesterolemia-data
    proven: untested
    proven_note: "Too early for a heart-attack trial."
    proven_source: https://www.hcplive.com/view/verve-102-lowers-pcsk9-ldl-c-interim-phase-1b-hypercholesterolemia-data
    note: "Early results (May 2026) lasted up to 18 months so far. A mid-stage trial was registered in Sep 2026 but hasn't started enrolling. The FDA gave it Fast Track status."
    sources: [https://www.hcplive.com/view/verve-102-lowers-pcsk9-ldl-c-interim-phase-1b-hypercholesterolemia-data]

  - id: zerlasiran
    name: Zerlasiran
    aliases: [SLN360]
    company: Silence Therapeutics
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, a few times a year
    often: "A few times a year"
    route: injection
    frequency: infrequent
    plain: "A shot a few times a year that strongly lowers Lp(a)."
    stage: phase2
    badge: on hold
    effect: "Lp(a) down 80%+"
    effect_short: "Lp(a) ↓ 80%+"
    effect_source: https://www.healio.com/news/cardiology/20250117/the-year-in-lipids-progress-in-lpa-management-and-a-blow-to-the-hdl-hypothesis
    proven: untested
    proven_note: "No heart-attack trial yet; one is planned once the company finds a partner."
    proven_source: https://www.biospace.com/drug-development/silence-quiets-phase-iii-pace-for-lipoprotein-drug-seeks-partner
