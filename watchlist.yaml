# Watchlist for the weekly drug-pipeline digest, organised by topic.
#
# Each drug's `stage` is a FLOOR: the digest takes the highest of this value,
# the highest phase seen on ClinicalTrials.gov, and an FDA approval found on
# openFDA. Use it for stages the APIs can't detect (e.g. "filed", or an
# approval outside the US). Stages: phase1, phase2, phase3, filed, approved.
#
# `aliases` are code names / brand names, used to search every source.
# `route` (pill, injection, infusion) and `frequency` (daily, monthly,
# infrequent, once) drive the filters on the site's pipeline.
# `badge` (optional) is a short tag shown next to the name in the pipeline strip.
# `plain` is a one-line plain-English description, used as context for the
# summary and as the "why it matters" fallback when the Claude API is off.
#
# Verified by web search on 2026-11-03 (sources listed per drug).
# Not tracked: daily LDL pills and drugs approved only outside the US
# (removed 2026-11-06: enlicitide, laroprovstat, obicetrapib).
# Added 2026-11-07: approved non-daily options (evolocumab, alirocumab, inclisiran).
# Lp(a) drugs were removed 2026-11-07 and restored 2026-11-12 as their own group
# under Heart & cholesterol. Not tracked: triglyceride-only drugs (solbinsiran).
# clinicaltrials.gov itself was not reachable from the build sandbox, so the
# first real run on GitHub Actions is the first check against the registry.

settings:
  horizon_days: 60          # "On the horizon" window
  min_trial_phase: 2        # ignore new trials / status changes below this phase (halts are always reported)
  max_news_per_drug: 5
  discovery:                # flag NEW industry Phase 2/3 trials (per topic `discovery`) not on the watchlist
    enabled: false          # off: mostly noise (2026-11-12)
    max_items: 5
  field_news:               # "In the field": broader news per topic beyond the watchlist
    enabled: true
    max_items: 3            # at most this many shown per topic per week

# Topics are the "drawers" in the cabinet. Each drug belongs to one. A topic sets
# the words the site uses for that kind of drug: what the main result is
# (`effect_label`), what the big outcome question is (`outcome`), and where to look
# for news beyond the list (`discovery` conditions on ClinicalTrials.gov,
# `field_queries` on Google News, with `field_focus` telling the summary what counts).
topics:
  - id: heart
    short: "Heart"
    title: Heart & cholesterol
    groups:                 # optional finer choices in the cabinet; drugs say which with `group`
      - {id: ldl, title: "LDL-lowering", effect_label: "LDL reduction"}
      - {id: lpa, title: "Lp(a)-lowering", effect_label: "Lp(a) reduction"}
    effect_label: LDL reduction
    effect_col: Lowers
    outcome:
      col: Heart attacks?
      title: CV outcomes
      "yes": Prevents heart attacks
      testing: Heart-attack trial underway
      failed: Didn't prevent heart attacks
      untested: No heart-attack data yet
      short: {"yes": Proven, testing: Trial underway, failed: Didn't prevent, untested: No data yet}
    discovery: ["Hypercholesterolemia", "Atherosclerotic Cardiovascular Disease"]
    field_queries:
      - '"LDL cholesterol" (drug OR trial OR FDA) when:7d'
      - 'PCSK9 when:7d'
      - '"cholesterol-lowering" (trial OR approval OR FDA) when:7d'
      - 'hypercholesterolemia "phase 3" when:7d'
    field_focus: "concrete developments in LDL-lowering treatment (not Lp(a)- or triglyceride-only drugs)"
    field_match: '\b(ldl|cholesterol|pcsk9|hypercholesterol\w*|statin)'
    explain: >
      LDL is the "bad" cholesterol that statins lower; the LDL drugs here do it
      without being a statin or a daily pill. Lp(a) is a separate, mostly inherited
      cholesterol particle that diet and statins barely touch; no Lp(a) drug is
      approved yet. Lowering either isn't automatically the same as preventing heart
      attacks: "Prevents heart attacks" means a large trial showed fewer heart
      attacks and strokes.

  - id: obesity
    short: "Obesity"
    title: Obesity & metabolism
    effect_label: Weight loss
    effect_col: Weight loss
    outcome:
      col: Heart attacks?
      title: CV outcomes
      "yes": Prevents heart attacks
      testing: Heart-outcome trial underway
      failed: Didn't prevent heart attacks
      untested: No heart-outcome data yet
      short: {"yes": Proven, testing: Trial underway, failed: Didn't prevent, untested: No data yet}
    discovery: ["Obesity"]
    field_queries:
      - 'obesity drug (FDA OR "phase 3") when:7d'
      - '"weight loss" (GLP-1 OR amylin) trial when:7d'
    field_focus: "concrete developments in obesity drugs (approvals, trial results, filings)"
    field_match: '\b(obesity|weight|glp-1|amylin|incretin)'
    explain: >
      Weight loss is the average drop in body weight in the main trials, usually
      over about a year and a half, on top of diet and exercise advice. Trials differ,
      so close numbers aren't a real difference. "Prevents heart attacks" means a large
      trial showed fewer heart attacks and strokes, not just weight loss.

  - id: alzheimers
    short: "Alzheimer's"
    title: Alzheimer's & the brain
    effect_label: Slowing of decline
    effect_col: Effect
    outcome:
      col: Slows decline?
      title: Clinical effect
      "yes": Slows decline
      testing: Main trial underway
      failed: Didn't slow decline
      untested: Not yet shown
      short: {"yes": Shown, testing: Trial underway, failed: Didn't slow, untested: Not yet shown}
    discovery: ["Alzheimer Disease"]
    field_queries:
      - "Alzheimer's (drug OR treatment) (FDA OR \"phase 3\" OR trial) when:7d"
    field_focus: "concrete developments in Alzheimer's treatment (approvals, trial results, filings)"
    field_match: "\\b(alzheimer|dementia|amyloid|tau)"
    explain: >
      These drugs clear amyloid, a protein that builds up in the brain in
      Alzheimer's. "Slowing of decline" is how much slower memory and daily
      function got worse than on placebo, in early-stage patients over about 18
      months. None stop or reverse the disease, and brain swelling or bleeding
      (ARIA) is a known risk.

  - id: cancer
    short: "Cancer"
    title: Cancer
    effect_label: Main result
    effect_col: Main result
    outcome:
      col: Longer survival?
      title: Survival
      "yes": Longer survival shown
      testing: Survival data pending
      failed: Survival benefit not shown
      untested: No survival data yet
      short: {"yes": Shown, testing: Pending, failed: Not shown, untested: No data yet}
    discovery: []           # too many new cancer trials each week to be useful
    field_queries:
      - '"FDA approves" cancer when:7d'
    field_focus: "major cancer-drug developments a general reader would care about (FDA approvals, practice-changing trial results)"
    field_match: '\b(cancer|tumou?r|oncology|carcinoma|lymphoma|leukemia|myeloma)'
    explain: >
      Cancer drugs are usually judged first on whether they hold off the cancer's
      growth for longer ("progression"), and then on whether people live longer.
      Each drug here is for a specific cancer, often only with a certain gene
      change.

# How each kind of drug works, as four plain steps; `acts` is the step (1-4) where the
# drug comes in. Shown as a small diagram on each drug's page (drugs name theirs in
# `approach`).
approaches:
  - id: pcsk9-block
    title: Blocking PCSK9
    steps:
      - Your liver pulls LDL out of the blood using receptors on its surface.
      - A protein called PCSK9 marks those receptors to be destroyed.
      - The drug grabs PCSK9 in the blood, so it can't.
      - More receptors survive, so more LDL is cleared from the blood.
    acts: 3
  - id: silence-pcsk9
    title: Silencing the PCSK9 message
    steps:
      - Liver cells copy the PCSK9 gene into a messenger (RNA) to make PCSK9.
      - PCSK9 marks the liver's LDL receptors to be destroyed.
      - The drug destroys the messenger, so far less PCSK9 is made, for months.
      - More receptors survive, so more LDL is cleared from the blood.
    acts: 3
  - id: edit-pcsk9
    title: Switching off the PCSK9 gene
    steps:
      - Liver cells use the PCSK9 gene to make PCSK9.
      - PCSK9 marks the liver's LDL receptors to be destroyed.
      - One infusion edits a single letter of the gene's DNA, switching it off.
      - Less PCSK9, more receptors, lower LDL, meant to last for life.
    acts: 3
  - id: silence-lpa
    title: Silencing the Lp(a) message
    steps:
      - Liver cells copy the LPA gene into a messenger (RNA) to make apo(a).
      - Apo(a) joins an LDL-like particle to form Lp(a).
      - The drug destroys the messenger, so far less apo(a) is made.
      - Fewer Lp(a) particles circulate in the blood.
    acts: 3
  - id: block-lpa
    title: Stopping Lp(a) from forming
    steps:
      - The liver makes apo(a) and an LDL-like particle.
      - Normally the two join together to form Lp(a).
      - The pill stops them joining.
      - Fewer Lp(a) particles circulate in the blood.
    acts: 3
  - id: incretin
    title: Acting on gut hormones
    steps:
      - After a meal, the gut releases hormones such as GLP-1.
      - They tell the brain you're full and slow the stomach.
      - The drug acts on these hormone signals (GLP-1, and for some also GIP or glucagon), and lasts far longer.
      - Appetite drops, people eat less, and weight falls steadily.
    acts: 3
  - id: amyloid
    title: Clearing amyloid
    steps:
      - Amyloid protein builds up into plaques between brain cells.
      - The plaques are linked to the damage behind memory loss.
      - The antibody sticks to amyloid and flags it.
      - The immune system clears it, slowing decline (not reversing it).
    acts: 3
  - id: estrogen-receptor
    title: Removing the estrogen receptor
    steps:
      - This breast cancer grows on estrogen signals, through its estrogen receptor.
      - A change in the ESR1 gene can make older hormone pills stop working.
      - The pill latches onto the receptor so the cell destroys it.
      - Without the receptor, the growth signal is cut off.
    acts: 3
  - id: kras-g12c
    title: Turning off a stuck growth switch
    steps:
      - KRAS is a switch that tells cells to grow.
      - A G12C change in the gene leaves the switch stuck on, driving the cancer.
      - The pill locks the faulty switch in its off position.
      - Taken with immunotherapy, the immune system attacks the tumor too.
    acts: 3
  - id: pd1-vegf
    title: Two jobs in one antibody
    steps:
      - Tumors switch off immune cells through a "brake" called PD-1.
      - They also grow new blood vessels using a signal called VEGF.
      - One antibody blocks both PD-1 and VEGF.
      - Immune cells can attack, and the tumor's blood supply is cut back.
    acts: 3

# Companies: follow everything a company is developing, across topics. A drug
# belongs to a company if its `company` contains one of `match`.
companies:
  - id: lilly
    title: Eli Lilly
    match: ["Lilly"]

# Who the summaries are written for. Personal details belong in the READER_CONTEXT
# GitHub secret, which overrides this; keep only a generic description here.
reader_context: >
  A curious layperson following these topics; not a clinician.

# Extra RSS feeds scanned for any watchlist drug name (in addition to a
# Google News search per drug, which picks up company press releases).
# (fda.gov's own RSS blocks GitHub's servers as bots, so it isn't listed;
# FDA approvals come from openFDA and FDA news shows up via Google News.)
feeds: []

# Dated events you know about (PDUFA dates, scheduled readouts). They appear
# under "On the horizon" when inside the window. Each needs a source URL.
events: []
#  - drug: obicetrapib
#    date: 2027-01-15
#    what: "FDA decision date (PDUFA)"
#    url: https://example.com/press-release

