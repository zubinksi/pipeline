# Watchlist for the weekly cholesterol-pipeline digest.
#
# Each drug's `stage` is a FLOOR: the digest takes the highest of this value,
# the highest phase seen on ClinicalTrials.gov, and an FDA approval found on
# openFDA. Use it for stages the APIs can't detect (e.g. "filed", or an
# approval outside the US). Stages: phase1, phase2, phase3, filed, approved.
#
# `aliases` are code names / brand names, used to search every source.
# `route` (pill, injection, infusion) and `frequency` (daily, monthly,
# infrequent, once) drive the filters on the site's pipeline.
# `badge` (optional) is a short tag shown next to the name in the pipeline strip.
# `plain` is a one-line plain-English description, used as context for the
# summary and as the "why it matters" fallback when the Claude API is off.
#
# Verified by web search on 2026-11-03 (sources listed per drug).
# Not tracked: daily-dosed drugs and drugs approved only outside the US
# (removed 2026-11-06: muvalaplin, enlicitide, laroprovstat, obicetrapib).
# clinicaltrials.gov itself was not reachable from the build sandbox, so the
# first real run on GitHub Actions is the first check against the registry.

settings:
  horizon_days: 60          # "On the horizon" window
  min_trial_phase: 2        # ignore new trials / status changes below this phase (halts are always reported)
  max_news_per_drug: 5
  discovery:                # flag NEW industry Phase 2/3 trials in these conditions that aren't on the watchlist
    enabled: true
    conditions: ["Hypercholesterolemia", "Lipoprotein(a)", "Hyperlipoproteinemia(a)", "Atherosclerotic Cardiovascular Disease"]
    max_items: 5

reader_context: >
  32 years old, not on cholesterol medication, with a family history of high
  cholesterol, so expects to need treatment eventually. Would prefer to avoid
  statins if possible. Most interested in non-statin options that don't need
  daily dosing (monthly or less often, or one-time), and anything targeting
  lipoprotein(a).

# Extra RSS feeds scanned for any watchlist drug name (in addition to a
# Google News search per drug, which picks up company press releases).
# (fda.gov's own RSS blocks GitHub's servers as bots, so it isn't listed;
# FDA approvals come from openFDA and FDA news shows up via Google News.)
feeds: []

# Dated events you know about (PDUFA dates, scheduled readouts). They appear
# under "On the horizon" when inside the window. Each needs a source URL.
events: []
#  - drug: obicetrapib
#    date: 2027-01-15
#    what: "FDA decision date (PDUFA)"
#    url: https://example.com/press-release

drugs:
  # Plain-language fields shown on the site: `lowers` (what it lowers),
  # `form` (how you'd take it), `plain` (one sentence), `note` (where it stands,
  # in plain words), `badge` (optional short flag).

  - id: lerodalcibep
    name: Lerodalcibep
    aliases: [Lerochol, LIB003]
    company: LIB Therapeutics
    target: PCSK9 (LDL)
    lowers: LDL
    form: Shot, once a month
    route: injection
    frequency: monthly
    plain: "A once-a-month shot that lowers LDL, the 'bad' cholesterol statins target. It can be kept at room temperature."
    stage: approved
    note: "FDA-approved in Dec 2025 as Lerochol. An auto-injector pen was approved in Aug 2026."
    sources: [https://www.tctmd.com/news/fda-approves-lerodalcibep-adults-hypercholesterolemia]

  - id: lepodisiran
    name: Lepodisiran
    aliases: [LY3819469]
    company: Eli Lilly
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, possibly once or twice a year
    route: injection
    frequency: infrequent
    plain: "A shot that switches off the liver's production of Lp(a) for many months at a time."
    stage: phase3
    note: "In a large final-stage trial (ACCLAIM-Lp(a)) testing whether it prevents heart attacks and strokes. Results are expected around 2029."
    sources: [https://www.clinicaltrialsarena.com/analyst-comment/jpm26-eli-lilly-lpa-drugs/]

  - id: olpasiran
    name: Olpasiran
    aliases: [AMG 890, AMG890]
    company: Amgen
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, every 3 months or less often
    route: injection
    frequency: infrequent
    plain: "A shot a few times a year that strongly lowers Lp(a)."
    stage: phase3
    note: "Its large final-stage trial (OCEAN(a)-Outcomes) is fully enrolled. Amgen hasn't said when results will come; some sources point to 2028."
    sources: [https://clinicaltrials.gov/study/NCT05581303]

  - id: pelacarsen
    name: Pelacarsen
    aliases: [TQJ230, "IONIS-APO(a)-LRx", AKCEA-APO(a)-LRx]
    company: Novartis / Ionis
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, once a month
    route: injection
    frequency: monthly
    plain: "A monthly shot that lowers Lp(a). It was the first Lp(a) drug to finish a large final-stage trial."
    stage: phase3
    badge: setback
    note: "Its large trial (Sep 2026) lowered Lp(a) but did not reduce heart attacks or strokes. Full results are still to be presented."
    sources: [https://www.tctmd.com/news/lpahorizon-top-line-results-dash-hopes-pelacarsen]

  - id: verve102
    name: VERVE-102
    aliases: ["VERVE 102", LY4636581]
    company: Eli Lilly (Verve)
    target: PCSK9 (gene editing)
    lowers: LDL
    form: One-time infusion
    route: infusion
    frequency: once
    plain: "A one-time gene-editing treatment meant to lower LDL for life."
    stage: phase2
    note: "Early results (May 2026) cut LDL by up to 62%, lasting up to 18 months so far. A mid-stage trial was registered in Sep 2026 but hasn't started enrolling. The FDA gave it Fast Track status."
    sources: [https://www.hcplive.com/view/verve-102-lowers-pcsk9-ldl-c-interim-phase-1b-hypercholesterolemia-data]

  - id: zerlasiran
    name: Zerlasiran
    aliases: [SLN360]
    company: Silence Therapeutics
    target: Lp(a)
    lowers: Lp(a)
    form: Shot, a few times a year
    route: injection
    frequency: infrequent
    plain: "A shot that cut Lp(a) by more than 80% in mid-stage testing."
    stage: phase2
    badge: on hold
    note: "Ready for final-stage trials, but the company won't start them until it finds a partner to fund them."
    sources: [https://www.biospace.com/drug-development/silence-quiets-phase-iii-pace-for-lipoprotein-drug-seeks-partner]

  - id: solbinsiran
    name: Solbinsiran
    aliases: [LY3561774]
    company: Eli Lilly
    target: ANGPTL3
    lowers: triglycerides & LDL
    form: Shot, a few times a year
    route: injection
    frequency: infrequent
    plain: "A shot that lowers triglycerides (another blood fat) and LDL."
    stage: phase2
    note: "In mid-stage testing, mainly in people with very high triglycerides."
    sources: [https://clinicaltrials.gov/study/NCT07269210]
