name: Daily update

# Every day except Monday (the weekly digest closes the week then): fetch all
# sources, add anything new to the week in progress, and rebuild the site. No email.
on:
  schedule:
    - cron: "7 13 * * 0,2-6"
  workflow_dispatch:
  push:
    # change this file to run an update now (e.g. echo $(date -u) > .github/kick/daily)
    paths: [".github/kick/daily"]

permissions:
  contents: write   # to commit state/ and site/ (Vercel deploys site/ on each commit)

concurrency:
  group: weekly-digest   # never at the same time as the weekly run or a site rebuild
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fetch and update the week
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          READER_CONTEXT: ${{ secrets.READER_CONTEXT }}
        run: python -m digest daily
      - name: Commit state and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state site
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
