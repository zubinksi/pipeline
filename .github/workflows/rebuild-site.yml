name: Rebuild site

# When you edit the watchlist or the site templates, rebuild site/ from the
# saved history (no fetching, no email). Commits made by this workflow use
# GITHUB_TOKEN, which doesn't trigger workflows, so there's no loop.
on:
  push:
    paths:
      - watchlist.yaml
      - digest/site.py
      - digest/templates/site/**
      - digest/static/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m digest site
      - name: Commit site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Rebuild site"
          git push
