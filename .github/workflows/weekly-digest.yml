name: Weekly digest

on:
  schedule:
    # Mondays 12:23 UTC (7:23am US Eastern in winter). Change to taste.
    - cron: "23 12 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = normal run; no-send = update state + site, no email; dry-run = nothing saved or sent"
        type: choice
        options: [send, no-send, dry-run]
        default: dry-run

permissions:
  contents: write   # to commit state/, history/ and site/ back (Vercel deploys site/ on each commit)

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
          READER_CONTEXT: ${{ secrets.READER_CONTEXT }}
          MODE: ${{ github.event.inputs.mode || 'send' }}
        run: |
          case "$MODE" in
            send)    python -m digest run ;;
            no-send) python -m digest run --no-send ;;
            dry-run) python -m digest run --dry-run ;;
          esac

      - name: Keep a copy of the rendered digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore

      - name: Commit snapshot, history and site
        if: github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state history site
          git diff --cached --quiet || git commit -m "Weekly pipeline update $(date -u +%F)"
          git push
